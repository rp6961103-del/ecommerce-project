<!DOCTYPE html>
<html>
<head>
    <title>Order Tracking</title>
</head>
<body>

<h1>Order #{{ order.id }}</h1>

<p>
    Status:
    <b>{{ order.status }}</b>
</p>

<hr>

<h3>Items</h3>

<ul>
    {% for item in order.items.all %}
        <li>{{ item.product.name }} × {{ item.quantity }}</li>
    {% endfor %}
</ul>

<hr>

<h3>Tracking Stage</h3>

<ul>
    <li>🟡 Pending</li>
    <li>🔵 Confirmed</li>
    <li>🟣 Shipped</li>
    <li>🟢 Delivered</li>
</ul>

<a href="{% url 'my_orders' %}">Back to My Orders</a>

</body>
</html>
