<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<div class="card p-4">

<h2 class="text-center mb-4">Checkout</h2>

{% if cart_items %}

<ul class="list-group mb-4">

{% for item in cart_items %}

<li class="list-group-item d-flex justify-content-between">

<span>{{ item.product.name }} × {{ item.quantity }}</span>

<strong>₹{{ item.subtotal }}</strong>

</li>

{% endfor %}

</ul>

<h3 class="text-end mb-4">
Total : ₹{{ total }}
</h3>

<form method="POST" action="{% url 'place_order' %}">
{% csrf_token %}


<div class="mb-3">
<label class="form-label">Customer Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" class="form-control" name="phone" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input
    type="email"
    class="form-control"
    name="email"
    placeholder="Enter your email"
    required>
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" name="address" rows="3" required></textarea>
</div>
<div class="mb-4">

<label class="form-label"><strong>Select Payment Method</strong></label>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment" value="Cash on Delivery" checked>
<label class="form-check-label">
Cash on Delivery
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment" value="UPI">
<label class="form-check-label">
UPI (Google Pay / PhonePe / Paytm)
</label>
</div>
<div id="upiBox" class="text-center mt-4" style="display:none;">

    <h5>Scan QR Code to Pay</h5>

<img src="/media/upi_qr.jpeg"
     width="250"
     class="img-fluid border rounded shadow"
     alt="UPI QR Code">

    <p class="mt-3">
        UPI ID:
        <strong>7993347413-2@ybl</strong>
    </p>

</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment" value="Card">
<label class="form-check-label">
Credit / Debit Card
</label>
</div>

</div>

<button class="btn btn-success w-100 btn-lg">
Place Order
</button>

</form>

{% else %}

<h3>Your cart is empty.</h3>

{% endif %}

</div>

</div>
<script>

const paymentOptions = document.getElementsByName("payment");

const upiBox = document.getElementById("upiBox");

paymentOptions.forEach(function(option){

    option.addEventListener("change", function(){

        if(this.value === "UPI"){

            upiBox.style.display = "block";

        }else{

            upiBox.style.display = "none";

        }

    });

});

</script>
</body>
</html>
