<!DOCTYPE html>
<html>
<head>
    <title>Manage Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Manage Orders</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Current Status</th>
                <th>Update Status</th>
            </tr>

        </thead>

        <tbody>

        {% for order in orders %}

            <tr>

                <td>#{{ order.id }}</td>

                <td>{{ order.customer_name }}</td>

                <td>
                    <strong>{{ order.status }}</strong>
                </td>

                <td>

                    <form method="POST" action="{% url 'update_order_status' order.id %}">

                        {% csrf_token %}

                        <select name="status" class="form-select mb-2">

                            <option value="Pending"
                            {% if order.status == "Pending" %}selected{% endif %}>
                                Pending
                            </option>

                            <option value="Confirmed"
                            {% if order.status == "Confirmed" %}selected{% endif %}>
                                Confirmed
                            </option>

                            <option value="Packed"
                            {% if order.status == "Packed" %}selected{% endif %}>
                                Packed
                            </option>

                            <option value="Shipped"
                            {% if order.status == "Shipped" %}selected{% endif %}>
                                Shipped
                            </option>

                            <option value="Out for Delivery"
                            {% if order.status == "Out for Delivery" %}selected{% endif %}>
                                Out for Delivery
                            </option>

                            <option value="Delivered"
                            {% if order.status == "Delivered" %}selected{% endif %}>
                                Delivered
                            </option>

                            <option value="Cancelled"
                            {% if order.status == "Cancelled" %}selected{% endif %}>
                                Cancelled
                            </option>

                        </select>

                        <button type="submit" class="btn btn-success btn-sm w-100">
                            Update Status
                        </button>

                    </form>

                </td>

            </tr>

        {% empty %}

            <tr>

                <td colspan="4" class="text-center">
                    No Orders Found
                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
