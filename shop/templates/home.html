<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>

    <style>
        body {
            padding-bottom: 80px;
        }

        .bottom-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ccc;
            z-index: 1000;
        }

        .bottom-buttons a {
            margin: 5px;
            padding: 8px 15px;
            text-decoration: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<h1>Welcome to E-Commerce Store</h1>


<hr>

<h2>Products</h2>

{% for product in products %}

<div style="border:1px solid black; padding:10px; margin:10px;">

    <h3>
        <a href="{% url 'product_detail' product.id %}">
            {{ product.name }}
        </a>
    </h3>

    <p>{{ product.description }}</p>

    <p>Price: ₹{{ product.price }}</p>

</div>

{% empty %}

<p>No products available.</p>

{% endfor %}


<!-- Fixed Bottom Buttons -->

<div class="bottom-buttons">

    <a href="{% url 'register' %}">
        Register
    </a>

    <a href="{% url 'login' %}">
        Login
    </a>

    <a href="{% url 'logout' %}">
        Logout
    </a>

    <a href="{% url 'cart' %}">
        Cart
    </a>

</div>


</body>
</html>
